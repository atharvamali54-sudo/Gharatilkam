<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharkam - Customer Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD7Y-2un6pfAY8rafRsAzMre-OvNBAkosU",
        authDomain: "gharkam-6c879.firebaseapp.com",
        databaseURL: "https://gharkam-6c879-default-rtdb.firebaseio.com",
        projectId: "gharkam-6c879",
        storageBucket: "gharkam-6c879.firebasestorage.app",
        messagingSenderId: "706729205935",
        appId: "1:706729205935:web:598569d60ad414765e345a"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
</head>
<body class="bg-blue-50/50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 border border-slate-100">
        
        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
            <a href="index.html" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-arrow-left"></i></a>
            Gharkam - Book Service
        </h2>

        <!-- Booking Form -->
        <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Select Service:</label>
                <select id="serviceName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Electrician">Electrician</option>
                    <option value="Plumber">Plumber</option>
                    <option value="Carpenter">Carpenter</option>
                    <option value="Cleaning">Cleaning</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Full Name:</label>
                <input type="text" id="customerName" required placeholder="तुमचे पूर्ण नाव" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Number:</label>
                <input type="tel" id="customerMobile" required placeholder="मोबाईल नंबर" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Select Area:</label>
                <select id="areaName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Swargate">Swargate</option>
                    <option value="Kothrud">Kothrud</option>
                    <option value="Katraj">Katraj</option>
                    <option value="Shivajinagar">Shivajinagar</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Full Address:</label>
                <textarea id="fullAddress" required rows="2" placeholder="संपूर्ण पत्ता" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Date:</label>
                    <input type="date" id="bookingDate" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Time:</label>
                    <input type="time" id="bookingTime" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center gap-2 text-sm mt-2">
                🚀 Book Appointment
            </button>

        </form>

        <hr class="border-slate-100 my-6">

        <!-- Live Status Section -->
        <div>
            <h3 class="font-bold text-slate-700 text-xs mb-3 flex items-center justify-between">
                <span>Live Booking Status</span>
                <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Realtime</span>
            </h3>
            <div id="bookingStatusBox" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                <p class="text-xs text-slate-400">अद्याप कोणतीही नवीन बुकिंग केलेली नाही.</p>
            </div>
        </div>

    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "कृपया वाट पहा...";

            const service = document.getElementById('serviceName').value;
            const name = document.getElementById('customerName').value;
            const mobile = document.getElementById('customerMobile').value;
            const area = document.getElementById('areaName').value;
            const address = document.getElementById('fullAddress').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            // Push order to Firebase Realtime Database
            const newOrderRef = database.ref("orders").push();
            const orderId = newOrderRef.key;

            newOrderRef.set({
                orderId: orderId,
                service: service,
                customerName: name,
                customerMobile: mobile,
                area: area,
                address: address,
                bookingDate: date,
                bookingTime: time,
                status: "Pending",
                timestamp: Date.now()
            }).then(() => {
                alert("ऑर्डर यशस्वीरीत्या नोंदवली गेली आहे!");
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Book Appointment";

                // Listen for Realtime Status Updates for this Order
                listenOrderStatus(orderId);
            }).catch((err) => {
                alert("ऑर्डर बुक करताना त्रुटी आली: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Book Appointment";
            });
        }

        function listenOrderStatus(orderId) {
            database.ref("orders/" + orderId).on("value", (snapshot) => {
                const item = snapshot.val();
                if(!item) return;

                const statusBox = document.getElementById('bookingStatusBox');
                const isAccepted = item.status === 'Accepted';

                statusBox.innerHTML = `
                    <div class="text-left space-y-1">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-slate-800 text-sm">${item.service} Service</span>
                            <span class="text-xs font-bold px-2 py-0.5 rounded-md ${isAccepted ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${item.status}</span>
                        </div>
                        <p class="text-xs text-slate-600"><strong>नाव:</strong> ${item.customerName}</p>
                        <p class="text-xs text-slate-600"><strong>तारीख व वेळ:</strong> ${item.bookingDate} | ${item.bookingTime}</p>
                        ${isAccepted ? '<p class="text-xs text-emerald-600 font-semibold mt-2">✓ वर्करने तुमची ऑर्डर स्वीकारली आहे!</p>' : '<p class="text-xs text-amber-600 font-semibold mt-2">⏳ वर्कर स्वीकारण्याची वाट पाहत आहे...</p>'}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
