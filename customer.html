<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Gharkam.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between" onload="initCustomerPage()">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🏠</span>
            <h1 class="text-xl font-bold">GHARKAM<span class="text-yellow-400">.com</span> (<span id="customerNameDisplay">Customer</span>)</h1>
        </div>
        <button onclick="logoutCustomer()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition text-white font-semibold">Logout</button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-lg w-full mx-auto p-6 my-6">
        
        <!-- Active Order Tracking Section (Initially Hidden) -->
        <div id="activeOrderSection" class="hidden bg-white p-6 rounded-2xl shadow-md border border-gray-200 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Live Order Status 🚀</h2>
                <span id="orderStatusBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800">Pending</span>
            </div>
            
            <div class="space-y-3 text-sm bg-gray-50 p-4 rounded-xl border mb-4">
                <p><strong>Service:</strong> <span id="trackService">-</span></p>
                <p><strong>Area:</strong> <span id="trackArea">-</span></p>
                <p><strong>Budget:</strong> ₹<span id="trackBudget">-</span></p>
                <p><strong>Scheduled:</strong> <span id="trackDate">-</span> at <span id="trackTime">-</span></p>
                <p><strong>Address:</strong> <span id="trackAddress">-</span></p>
            </div>

            <button onclick="cancelOrder()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow transition duration-300">
                Cancel Order
            </button>
        </div>

        <!-- Book a Service Form Container -->
        <div id="bookingFormContainer" class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Book a Home Service 🛠️</h2>
            
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                
                <!-- Service Type -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Service:</label>
                    <select id="serviceType" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="">-- Service Nivada --</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Electrician">Electrician (Bijali repair)</option>
                        <option value="Plumbing">Plumber (Nal/Pipe repair)</option>
                        <option value="Painting">Painting</option>
                    </select>
                </div>

                <!-- Area -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Area In Pune:</label>
                    <select id="area" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="">-- Area Nivada --</option>
                        <option value="Swargate">Swargate</option>
                        <option value="Katraj">Katraj</option>
                        <option value="Shivajinagar">Shivajinagar</option>
                        <option value="Kothrud">Kothrud</option>
                        <option value="Hadapsar">Hadapsar</option>
                    </select>
                </div>

                <!-- Photo Upload -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Upload Photo of Work (Kamacha Photo):</label>
                    <input type="file" id="workPhoto" accept="image/*" class="w-full p-2 border rounded-xl text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <!-- Budget -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Your Budget / Payment Offer (₹):</label>
                    <input type="number" id="budget" placeholder="E.g., 300" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <!-- Date & Time -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Date:</label>
                        <input type="date" id="orderDate" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Time:</label>
                        <input type="time" id="orderTime" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Exact Location / Address In Pune:</label>
                    <textarea id="address" placeholder="E.g., Flat No 4, Near Bus Stand" rows="2" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-300">
                    Book Appointment
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-xs bg-white border-t">
        &copy; 2026 Gharkam.com | Customer Portal
    </footer>

    <!-- Logic Script -->
    <script>
        let customerSession = null;

        function initCustomerPage() {
            let sessionJson = localStorage.getItem('current_user_session');
            if (sessionJson) {
                customerSession = JSON.parse(sessionJson);
                if (customerSession.role !== 'customer') {
                    alert("Unauthorized access!");
                    window.location.href = "index.html";
                    return;
                }
                if (customerSession.email) {
                    let name = customerSession.email.split('@')[0].toUpperCase();
                    document.getElementById('customerNameDisplay').innerText = name;
                }
            } else {
                alert("Krupaya pahile Login kara!");
                window.location.href = "index.html";
                return;
            }

            checkActiveOrder();
            
            // Poll localStorage every 2 seconds to catch live status updates from workers
            setInterval(checkActiveOrder, 2000);
        }

        function checkActiveOrder() {
            let activeOrderJson = localStorage.getItem('gharkamActiveOrder');
            let bookingFormContainer = document.getElementById('bookingFormContainer');
            let activeOrderSection = document.getElementById('activeOrderSection');

            if (activeOrderJson) {
                let order = JSON.parse(activeOrderJson);
                
                // Hide booking form, show tracker
                bookingFormContainer.classList.add('hidden');
                activeOrderSection.classList.remove('hidden');

                // Populate tracking details
                document.getElementById('trackService').innerText = order.service;
                document.getElementById('trackArea').innerText = order.area;
                document.getElementById('trackBudget').innerText = order.budget;
                document.getElementById('trackDate').innerText = order.date;
                document.getElementById('trackTime').innerText = order.time;
                document.getElementById('trackAddress').innerText = order.address;

                // Status Badge styling
                let statusBadge = document.getElementById('orderStatusBadge');
                let status = order.status || 'Pending';
                statusBadge.innerText = status;

                if (status === 'Pending') {
                    statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800";
                } else if (status === 'Accepted') {
                    statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800";
                } else if (status === 'Completed') {
                    statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800";
                }
            } else {
                // Show booking form, hide tracker
                bookingFormContainer.classList.remove('hidden');
                activeOrderSection.classList.add('hidden');
            }
        }

        function submitOrder(event) {
            event.preventDefault();
            let fileInput = document.getElementById('workPhoto');

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let orderData = {
                        customerMobile: customerSession.mobile,
                        service: document.getElementById('serviceType').value,
                        area: document.getElementById('area').value,
                        budget: document.getElementById('budget').value,
                        date: document.getElementById('orderDate').value,
                        time: document.getElementById('orderTime').value,
                        address: document.getElementById('address').value,
                        photo: e.target.result,
                        status: 'Pending' // Initial status
                    };

                    localStorage.setItem('gharkamActiveOrder', JSON.stringify(orderData));
                    alert("Order Successfully Book Zali!");
                    checkActiveOrder();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Krupaya kamacha photo upload kara!");
            }
        }

        function cancelOrder() {
            if (confirm("Are you sure you want to cancel this order?")) {
                localStorage.removeItem('gharkamActiveOrder');
                alert("Order Cancelled.");
                checkActiveOrder();
            }
        }

        function logoutCustomer() {
            localStorage.removeItem('current_user_session');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
