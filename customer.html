<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharkam - Customer Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD7Y-2un6pfAY8rafRsAzMre-OvNBAkosU",
        authDomain: "gharkam-6c879.firebaseapp.com",
        databaseURL: "https://gharkam-6c879-default-rtdb.firebaseio.com",
        projectId: "gharkam-6c879",
        storageBucket: "gharkam-6c879.firebasestorage.app",
        messagingSenderId: "706729205935",
        appId: "1:706729205935:web:598569d60ad414765e345a"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
</head>
<body class="bg-blue-50/40 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-slate-100">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-black text-slate-800">Gharkam</h1>
            <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline"><i class="fa-solid fa-house"></i> Home</a>
        </div>

        <!-- Booking Form -->
        <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Select Service:</label>
                <select id="serviceName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Electrician">Electrician</option>
                    <option value="Plumber">Plumber</option>
                    <option value="Carpenter">Carpenter</option>
                    <option value="Cleaner">Cleaner</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Full Name:</label>
                <input type="text" id="customerName" placeholder="तुमचे नाव टाका" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Mobile Number:</label>
                <input type="tel" id="customerMobile" placeholder="मोबाईल नंबर टाका" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Select Area:</label>
                <select id="areaName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Swargate">Swargate</option>
                    <option value="Kothrud">Kothrud</option>
                    <option value="Katraj">Katraj</option>
                    <option value="Shivajinagar">Shivajinagar</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Full Address:</label>
                <textarea id="fullAddress" rows="2" placeholder="संपूर्ण पत्ता टाका" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Date:</label>
                    <input type="date" id="bookingDate" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Time:</label>
                    <input type="time" id="bookingTime" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Photo (Optional):</label>
                <input type="file" id="photoFile" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/30 transition text-base mt-2 flex items-center justify-center gap-2">
                🚀 Book Appointment
            </button>
        </form>

        <hr class="border-slate-100 my-6">

        <!-- Live Booking Status Stream -->
        <div>
            <h3 class="font-bold text-slate-700 text-sm mb-3 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Live Booking Status
            </h3>
            <div id="customerStatusList" class="space-y-3">
                <p class="text-slate-400 text-xs text-center py-2">कोणतीही बुकिंग उपलब्ध नाही.</p>
            </div>
        </div>

    </div>

    <script>
        // Default today's date set करणे
        document.getElementById('bookingDate').valueAsDate = new Date();

        // Form Submit Handler (Fix for Button Click)
        function handleFormSubmit(event) {
            event.preventDefault(); // Page refresh रोखण्यासाठी

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "कृपया थांबा...";
            submitBtn.disabled = true;

            const service = document.getElementById('serviceName').value;
            const name = document.getElementById('customerName').value;
            const mobile = document.getElementById('customerMobile').value;
            const area = document.getElementById('areaName').value;
            const address = document.getElementById('fullAddress').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            // Push data to Firebase Realtime Database
            const newOrderRef = database.ref("orders").push();
            newOrderRef.set({
                service: service,
                customerName: name,
                customerMobile: mobile,
                area: area,
                address: address,
                date: date,
                time: time,
                status: "Pending",
                timestamp: Date.now()
            }).then(() => {
                alert("ऑर्डर यशस्वीरीत्या बुक झाली आहे!");
                document.getElementById('bookingForm').reset();
                document.getElementById('bookingDate').valueAsDate = new Date();
                submitBtn.innerHTML = "🚀 Book Appointment";
                submitBtn.disabled = false;
            }).catch((err) => {
                alert("त्रुटी आली: " + err.message);
                submitBtn.innerHTML = "🚀 Book Appointment";
                submitBtn.disabled = false;
            });
        }

        // Live Realtime Listener for Customer Status Card
        database.ref("orders").on("value", (snapshot) => {
            const container = document.getElementById('customerStatusList');
            container.innerHTML = "";
            const data = snapshot.val();

            if (!data) {
                container.innerHTML = '<p class="text-slate-400 text-xs text-center py-2">कोणतीही बुकिंग उपलब्ध नाही.</p>';
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.slice(0, 3).forEach(key => { // सर्वात नवीन ३ ऑर्डर्स दाखवा
                const item = data[key];
                const isAccepted = item.status === 'Accepted';

                const statusCard = document.createElement('div');
                statusCard.className = `p-3.5 rounded-xl border ${isAccepted ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} transition flex justify-between items-center`;
                statusCard.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800 text-xs">${item.service}</span>
                            <span class="text-[10px] text-slate-400">(${item.area})</span>
                        </div>
                        <p class="text-[11px] text-slate-500">${item.date || ''} ${item.time || ''}</p>
                    </div>
                    <div>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isAccepted ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${isAccepted ? '✓ Work Accepted' : '⏳ Pending'}
                        </span>
                    </div>
                `;
                container.appendChild(statusCard);
            });
        });
    </script>
</body>
</html>
