<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Booking - Gharkam.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #e0f2fe 0%, #f3f4f6 50%, #e0e7ff 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 3D Floating Background Icons Animation */
        .bg-icon {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.18;
            filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.2));
            animation: float3d 12s infinite ease-in-out alternate;
            user-select: none;
            pointer-events: none;
        }

        @keyframes float3d {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-25px) rotate(15deg) scale(1.1);
            }
            100% {
                transform: translateY(20px) rotate(-15deg) scale(0.95);
            }
        }

        .icon-1 { top: 8%; left: 5%; animation-duration: 9s; }
        .icon-2 { top: 25%; right: 8%; animation-duration: 11s; animation-delay: 1s; }
        .icon-3 { top: 50%; left: 7%; animation-duration: 13s; animation-delay: 2s; }
        .icon-4 { top: 75%; right: 6%; animation-duration: 10s; animation-delay: 0.5s; }
        .icon-5 { top: 90%; left: 12%; animation-duration: 14s; animation-delay: 1.5s; }
    </style>
</head>
<body class="p-4 max-w-lg mx-auto pb-12" onload="initCustomerPage()">

    <!-- 3D Moving Tool Background Icons -->
    <div class="bg-icon icon-1">🔨</div>
    <div class="bg-icon icon-2">🖌️</div>
    <div class="bg-icon icon-3">🔧</div>
    <div class="bg-icon icon-4">🪠</div>
    <div class="bg-icon icon-5">⚡</div>

    <div class="bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-white/60 relative z-10 space-y-4">
        
        <!-- Header Section with Faint Blue Box & Top Right Buttons -->
        <div class="bg-gradient-to-r from-blue-50 via-indigo-50 to-blue-100 p-4 rounded-2xl border border-blue-200/70 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-gray-800 tracking-tight">Gharkam.com - Book Service</h1>
                <p class="text-xs text-gray-600 font-medium">Customer Account: <span id="custEmailDisplay" class="font-semibold text-blue-600">atharvamali53@gmail.com</span></p>
            </div>

            <!-- Top Right Options -->
            <div class="flex flex-col items-end space-y-2">
                <!-- Your Order Button -->
                <button onclick="scrollToStatusCard()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-md transition flex items-center space-x-1 active:scale-95">
                    <span>📦</span>
                    <span>Your Order</span>
                </button>

                <!-- Customer Care Support Link -->
                <a href="tel:7875160724" class="text-[11px] font-bold text-green-700 bg-white/90 hover:bg-green-50 border border-green-300 px-2.5 py-1 rounded-xl flex items-center space-x-1 shadow-sm transition active:scale-95">
                    <span>📞</span>
                    <span>Support: 7875160724</span>
                </a>
            </div>
        </div>

        <!-- Booking Form -->
        <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-3 pt-2">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name:</label>
                <input type="text" id="custName" required placeholder="Tumche Naav" class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Mobile Number:</label>
                <input type="tel" id="custMobile" required placeholder="Mobile Number" class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Service:</label>
                <select id="custService" required class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
                    <option value="">-- Service Nivada --</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Cooking">Cooking</option>
                    <option value="Electrician">Electrician</option>
                    <option value="Plumber">Plumber</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Budget (₹):</label>
                <input type="number" id="custBudget" required placeholder="Budget Amount" class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Area:</label>
                <select id="custArea" required class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
                    <option value="">-- Area Nivada --</option>
                    <option value="Swargate">Swargate</option>
                    <option value="Katraj">Katraj</option>
                    <option value="Shivajinagar">Shivajinagar</option>
                    <option value="Kothrud">Kothrud</option>
                    <option value="Hadapsar">Hadapsar</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Full Address:</label>
                <textarea id="custAddress" required rows="2" placeholder="Sampurna Pata" class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Date:</label>
                    <input type="date" id="custDate" required class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Time:</label>
                    <input type="time" id="custTime" required class="w-full p-2.5 text-sm border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Photo (Optional):</label>
                <input type="file" id="custPhoto" accept="image/*" class="w-full text-xs text-gray-500 border rounded-xl p-2 bg-gray-50/50">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md hover:shadow-lg active:scale-98">
                🚀 Book Appointment
            </button>
        </form>

        <!-- Order Live Status Section -->
        <div id="statusCard" class="hidden border-t pt-4 space-y-2">
            <h3 class="font-bold text-sm text-gray-800">Your Current Order Status</h3>
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-xs space-y-1">
                <p><strong>Order ID:</strong> <span id="statusOrderId">--</span></p>
                <p><strong>Service:</strong> <span id="statusService">--</span></p>
                <p><strong>Status:</strong> <span id="statusBadge" class="font-bold px-2 py-0.5 rounded text-white bg-yellow-500">Pending</span></p>
                <p id="workerAssignedText" class="hidden text-green-700 font-semibold pt-1">🛵 Worker On The Way!</p>
            </div>
        </div>
    </div>

    <script>
        let customerSession = null;
        let base64Photo = "";

        function initCustomerPage() {
            let sessionJson = localStorage.getItem('current_user_session');
            if (sessionJson) {
                customerSession = JSON.parse(sessionJson);
                if (customerSession.email) {
                    document.getElementById('custEmailDisplay').innerText = customerSession.email;
                }
                if (customerSession.mobile) {
                    document.getElementById('custMobile').value = customerSession.mobile;
                }
            }

            document.getElementById('custPhoto').addEventListener('change', function(e) {
                let file = e.target.files[0];
                if (file) {
                    let reader = new FileReader();
                    reader.onload = function(evt) { base64Photo = evt.target.result; };
                    reader.readAsDataURL(file);
                }
            });

            checkLiveStatus();
            setInterval(checkLiveStatus, 2000);
        }

        function handleBooking(e) {
            e.preventDefault();

            let mobile = document.getElementById('custMobile').value.trim();
            let newOrder = {
                orderId: 'ORD_' + Date.now(),
                customerName: document.getElementById('custName').value.trim(),
                customerMobile: mobile,
                service: document.getElementById('custService').value,
                budget: document.getElementById('custBudget').value,
                area: document.getElementById('custArea').value,
                address: document.getElementById('custAddress').value.trim(),
                bookingDate: document.getElementById('custDate').value,
                bookingTime: document.getElementById('custTime').value,
                photo: base64Photo,
                status: 'Pending',
                isClaimed: false,
                workerMobile: null
            };

            let allOrders = JSON.parse(localStorage.getItem('gharkamAllOrders') || '[]');
            allOrders.push(newOrder);
            localStorage.setItem('gharkamAllOrders', JSON.stringify(allOrders));
            localStorage.setItem('gharkam_order_' + mobile, JSON.stringify(newOrder));

            alert("Order Booked Successfully!");
            checkLiveStatus();
            scrollToStatusCard();
        }

        function checkLiveStatus() {
            let mobile = document.getElementById('custMobile').value.trim();
            if (!mobile) return;

            let allOrders = JSON.parse(localStorage.getItem('gharkamAllOrders') || '[]');
            let myOrder = allOrders.reverse().find(o => o.customerMobile === mobile);

            if (myOrder) {
                document.getElementById('statusCard').classList.remove('hidden');
                document.getElementById('statusOrderId').innerText = myOrder.orderId;
                document.getElementById('statusService').innerText = myOrder.service;
                
                let badge = document.getElementById('statusBadge');
                badge.innerText = myOrder.status;

                if (myOrder.status === 'Pending') {
                    badge.className = "font-bold px-2 py-0.5 rounded text-white bg-yellow-500";
                    document.getElementById('workerAssignedText').classList.add('hidden');
                } else if (myOrder.status === 'Accepted' || myOrder.status === 'OnTheWay') {
                    badge.className = "font-bold px-2 py-0.5 rounded text-white bg-blue-600";
                    document.getElementById('workerAssignedText').classList.remove('hidden');
                } else if (myOrder.status === 'Completed') {
                    badge.className = "font-bold px-2 py-0.5 rounded text-white bg-green-600";
                    document.getElementById('workerAssignedText').classList.add('hidden');
                }
            }
        }

        function scrollToStatusCard() {
            let statusCard = document.getElementById('statusCard');
            if (!statusCard.classList.contains('hidden')) {
                statusCard.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Ajun konti pan order book keleli nahi.");
            }
        }
    </script>
</body>
</html>
