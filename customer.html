<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharkam - Customer Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD7Y-2un6pfAY8rafRsAzMre-OvNBAkosU",
        authDomain: "gharkam-6c879.firebaseapp.com",
        databaseURL: "https://gharkam-6c879-default-rtdb.firebaseio.com",
        projectId: "gharkam-6c879",
        storageBucket: "gharkam-6c879.firebasestorage.app",
        messagingSenderId: "706729205935",
        appId: "1:706729205935:web:598569d60ad414765e345a"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
</head>
<body class="bg-gradient-to-br from-blue-600 via-indigo-700 to-blue-900 min-h-screen p-4 md:p-8 flex items-center justify-center font-sans">

    <div class="w-full max-w-5xl bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        
        <!-- Top Header Navigation -->
        <header class="bg-white px-6 py-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2 text-2xl font-black tracking-tight text-slate-800 hover:opacity-80 transition">
                    <span class="bg-blue-600 text-white p-2 rounded-xl text-lg flex items-center justify-center shadow-md">🏠 GK</span>
                    <span class="text-blue-600">GHARKAM<span class="text-slate-700">.com</span></span>
                </a>
                <span class="hidden md:inline-block text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">
                    Pune City Services
                </span>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 📍 Pune Verified
                </span>
            </div>
        </header>

        <!-- Main Content Area: Split Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-0">
            
            <!-- Left Side: Form Container -->
            <div class="lg:col-span-7 p-6 md:p-8 bg-white">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-blue-600"></i> Book Your Appointment
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">पुण्यातील विश्वासू कामगारांची सेवा मिळवण्यासाठी फॉर्म भरा.</p>
                </div>

                <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Select Service</label>
                        <select id="serviceName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            <option value="Electrician">⚡ Electrician (इलेक्ट्रिशियन)</option>
                            <option value="Plumber">🚰 Plumber (प्लंबर)</option>
                            <option value="Carpenter">🪚 Carpenter (सुतार)</option>
                            <option value="Cleaner">🧹 Home Cleaner (सफाई)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                            <input type="text" id="customerName" placeholder="तुमचे पूर्ण नाव" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile Number</label>
                            <input type="tel" id="customerMobile" placeholder="मोबाईल नंबर" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Select Area</label>
                        <select id="areaName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            <option value="Swargate">Swargate</option>
                            <option value="Kothrud">Kothrud</option>
                            <option value="Katraj">Katraj</option>
                            <option value="Shivajinagar">Shivajinagar</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Address</label>
                        <textarea id="fullAddress" rows="2" placeholder="घर क्रमांक, सोसायटी, गल्ली किंवा लँडमार्क..." required class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Date</label>
                            <input type="date" id="bookingDate" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-semibold py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Time</label>
                            <input type="time" id="bookingTime" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-semibold py-2.5 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Photo (Optional)</label>
                        <input type="file" id="photoFile" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 transition">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/30 transition text-base mt-4 flex items-center justify-center gap-2">
                        🚀 Book Appointment
                    </button>
                </form>
            </div>

            <!-- Right Side: Live Status Tracker & Support -->
            <div class="lg:col-span-5 bg-slate-50 p-6 md:p-8 border-t lg:border-t-0 lg:border-l border-slate-200 flex flex-col justify-between">
                
                <!-- Section 1: Detailed Live Booking Status -->
                <div>
                    <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Live Booking Status
                    </h3>

                    <div id="customerStatusList">
                        <p class="text-slate-400 text-xs text-center py-8">कोणतीही बुकिंग उपलब्ध नाही.</p>
                    </div>
                </div>

                <!-- Section 2: Customer Care Support -->
                <div class="mt-8 bg-white p-5 rounded-2xl border border-blue-100 shadow-sm">
                    <h4 class="font-bold text-slate-800 text-sm mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-headset text-emerald-600"></i> Customer Care Support
                    </h4>
                    <p class="text-xs text-slate-500 mb-4">काही मदत हवी असल्यास थेट आमच्या सपोर्ट टीमशी संपर्क साधा.</p>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <a href="tel:7875160724" class="flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2.5 px-3 rounded-xl transition">
                            <i class="fa-solid fa-phone text-blue-600"></i> Call Support
                        </a>
                        <a href="https://wa.me/917875160724?text=Hello%20Gharkam%20Support," target="_blank" class="flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs py-2.5 px-3 rounded-xl shadow-sm transition">
                            <i class="fa-brands fa-whatsapp text-white text-sm"></i> WhatsApp
                        </a>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        document.getElementById('bookingDate').valueAsDate = new Date();

        // Form Submission Logic
        function handleFormSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "कृपया थांबा...";
            submitBtn.disabled = true;

            const service = document.getElementById('serviceName').value;
            const name = document.getElementById('customerName').value;
            const mobile = document.getElementById('customerMobile').value;
            const area = document.getElementById('areaName').value;
            const address = document.getElementById('fullAddress').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            const newOrderRef = database.ref("orders").push();
            newOrderRef.set({
                service: service,
                customerName: name,
                customerMobile: mobile,
                area: area,
                address: address,
                date: date,
                time: time,
                status: "Pending",
                timestamp: Date.now()
            }).then(() => {
                alert("ऑर्डर यशस्वीरीत्या बुक झाली आहे!");
                document.getElementById('bookingForm').reset();
                document.getElementById('bookingDate').valueAsDate = new Date();
                submitBtn.innerHTML = "🚀 Book Appointment";
                submitBtn.disabled = false;
            }).catch((err) => {
                alert("त्रुटी आली: " + err.message);
                submitBtn.innerHTML = "🚀 Book Appointment";
                submitBtn.disabled = false;
            });
        }

        // Live Realtime Listener for Customer Status UI Timeline
        database.ref("orders").on("value", (snapshot) => {
            const container = document.getElementById('customerStatusList');
            container.innerHTML = "";
            const data = snapshot.val();

            if (!data) {
                container.innerHTML = '<p class="text-slate-400 text-xs text-center py-8">कोणतीही बुकिंग उपलब्ध नाही.</p>';
                return;
            }

            const keys = Object.keys(data).reverse();
            // Display latest active order status card
            keys.slice(0, 1).forEach(key => {
                const item = data[key];
                
                const isAccepted = item.status === 'Accepted';
                const isOnTheWay = item.status === 'On The Way';
                const isCompleted = item.status === 'Completed';

                const statusCard = document.createElement('div');
                statusCard.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4";
                
                statusCard.innerHTML = `
                    <!-- Top Header Status -->
                    <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                        <span class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
                            📦 Live Booking Status
                        </span>
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${isAccepted ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${isAccepted ? '✓ Worker Assigned' : '⏳ Finding Worker'}
                        </span>
                    </div>

                    <!-- Detail Box -->
                    <div class="bg-blue-50/60 p-3.5 rounded-xl border border-blue-100 text-xs space-y-1.5 text-slate-700">
                        <p><strong>Service:</strong> ${item.service}</p>
                        <p><strong>Budget:</strong> ₹500</p>
                        <p><strong>Assigned Worker ID/Mobile:</strong> <span class="${isAccepted ? 'text-emerald-700 font-bold' : 'text-blue-600'}">${isAccepted ? (item.workerMobile || 'Accepted by Worker') : 'Finding Worker...'}</span></p>
                        <p><strong>Address:</strong> ${item.address || item.area}</p>
                    </div>

                    <!-- 4-Step Timeline Tracker -->
                    <div class="relative pl-6 space-y-4 border-l-2 border-slate-200 my-2 text-xs">
                        
                        <!-- Step 1 -->
                        <div class="relative">
                            <span class="absolute -left-[31px] top-0 w-6 h-6 rounded-full bg-amber-500 text-white font-bold flex items-center justify-center text-[10px]">1</span>
                            <h5 class="font-bold text-slate-800">Order Requested</h5>
                            <p class="text-[11px] text-slate-500">Kamachi request successfully pathvali aahe.</p>
                        </div>

                        <!-- Step 2 -->
                        <div class="relative">
                            <span class="absolute -left-[31px] top-0 w-6 h-6 rounded-full ${isAccepted || isOnTheWay || isCompleted ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'} font-bold flex items-center justify-center text-[10px]">2</span>
                            <h5 class="font-bold ${isAccepted || isOnTheWay || isCompleted ? 'text-slate-800' : 'text-slate-400'}">Worker Accepted</h5>
                            <p class="text-[11px] text-slate-400">Worker ne tumchi order accept keli aahe.</p>
                        </div>

                        <!-- Step 3 -->
                        <div class="relative">
                            <span class="absolute -left-[31px] top-0 w-6 h-6 rounded-full ${isOnTheWay || isCompleted ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'} font-bold flex items-center justify-center text-[10px]">3</span>
                            <h5 class="font-bold ${isOnTheWay || isCompleted ? 'text-slate-800' : 'text-slate-400'}">Worker On The Way</h5>
                            <p class="text-[11px] text-slate-400">Worker tumchya location var yet aahe.</p>
                        </div>

                        <!-- Step 4 -->
                        <div class="relative">
                            <span class="absolute -left-[31px] top-0 w-6 h-6 rounded-full ${isCompleted ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'} font-bold flex items-center justify-center text-[10px]">4</span>
                            <h5 class="font-bold ${isCompleted ? 'text-slate-800' : 'text-slate-400'}">Work Completed</h5>
                            <p class="text-[11px] text-slate-400">Kam yashasvirita puran zale aahe.</p>
                        </div>

                    </div>
                `;
                container.appendChild(statusCard);
            });
        });
    </script>
</body>
</html>
