<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - Live Orders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD7Y-2un6pfAY8rafRsAzMre-OvNBAkosU",
        authDomain: "gharkam-6c879.firebaseapp.com",
        databaseURL: "https://gharkam-6c879-default-rtdb.firebaseio.com",
        projectId: "gharkam-6c879",
        storageBucket: "gharkam-6c879.firebasestorage.app",
        messagingSenderId: "706729205935",
        appId: "1:706729205935:web:598569d60ad414765e345a"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <a href="index.html" class="hover:underline flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Gharkam</a> | Worker Dashboard
            </h1>
            <div class="flex items-center gap-2 bg-emerald-800 px-3 py-1.5 rounded-xl border border-emerald-600 text-sm">
                <i class="fa-solid fa-wallet text-amber-400"></i>
                <span>वॉलेट: <strong id="walletBalance">₹100</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <!-- Wallet Topup Section -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-lg font-bold text-slate-800">वॉलेट बॅलन्स रीचार्ज करा</h2>
                <p class="text-slate-500 text-sm">नवीन ऑर्डर्स स्वीकारण्यासाठी वॉलेटमध्ये किमान ₹50 असणे आवश्यक आहे.</p>
            </div>
            <button onclick="payWithRazorpay(100)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> ₹100 ॲड करा (Razorpay)
            </button>
        </div>

        <!-- Live Orders Stream -->
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-bell text-emerald-600 animate-pulse"></i> उपलब्ध ऑर्डर्स (Live Stream)
                </h3>
                <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">Realtime Auto Update</span>
            </div>

            <div id="workerOrders" class="grid md:grid-cols-2 gap-4">
                <p class="text-slate-400 text-sm text-center py-8 col-span-2">नवीन ऑर्डर्स शोधत आहोत...</p>
            </div>
        </div>

    </main>

    <script>
        let currentBalance = 100;

        // Razorpay Payment Gateway Integration
        function payWithRazorpay(amountToPay) {
            var options = {
                "key": "YOUR_RAZORPAY_KEY_ID",
                "amount": amountToPay * 100,
                "currency": "INR",
                "name": "Gharkam Services",
                "description": "Worker Wallet Top-up",
                "handler": function (response) {
                    alert("पेमेंट यशस्वी झाले! Payment ID: " + response.razorpay_payment_id);
                    currentBalance += amountToPay;
                    document.getElementById('walletBalance').innerText = '₹' + currentBalance;
                },
                "prefill": {
                    "name": "Worker Partner",
                    "contact": "9876543210"
                },
                "theme": {
                    "color": "#047857"
                }
            };
            
            try {
                var rzp1 = new Razorpay(options);
                rzp1.open();
            } catch(e) {
                if(confirm("Razorpay Key अद्याप कॉन्फिगर केलेली नाही. टेस्टिंगसाठी वॉलेटमध्ये ₹100 ॲड करायचे का?")) {
                    currentBalance += amountToPay;
                    document.getElementById('walletBalance').innerText = '₹' + currentBalance;
                }
            }
        }

        // Accept Order & Deduct ₹10 Logic
        function acceptOrder(orderKey) {
            // Minimum balance check (₹50 mandatory)
            if (currentBalance < 50) {
                alert("ऑर्डर स्वीकारण्यासाठी वॉलेटमध्ये किमान ₹50 असणे आवश्यक आहे! कृपया आधी वॉलेट रीचार्ज करा.");
                return;
            }

            database.ref("orders/" + orderKey).update({
                status: "Accepted"
            }).then(() => {
                // Deduct ₹10 per accepted job
                currentBalance -= 10;
                document.getElementById('walletBalance').innerText = '₹' + currentBalance;
                
                alert("ऑर्डर स्वीकारली आहे! तुमच्या वॉलेटमधून ₹10 कट करण्यात आले आहेत.");
            }).catch((err) => {
                alert("त्रुटी आली: " + err.message);
            });
        }

        // Realtime Data Listener for Workers
        database.ref("orders").on("value", (snapshot) => {
            const container = document.getElementById('workerOrders');
            container.innerHTML = "";
            const data = snapshot.val();

            if(!data) {
                container.innerHTML = '<p class="text-slate-400 text-sm text-center py-8 col-span-2">सध्या कोणतीही नवीन ऑर्डर उपलब्ध नाही.</p>';
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const item = data[key];
                const isAccepted = item.status === 'Accepted';

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl shadow-sm border ${isAccepted ? 'bg-slate-100 border-slate-200 opacity-75' : 'bg-white border-slate-200 hover:shadow-md'} transition`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-lg">${item.service}</span>
                        <span class="text-xs font-semibold ${isAccepted ? 'text-emerald-700' : 'text-amber-600'}">${item.status}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-base mb-1">${item.customerName}</h4>
                    <p class="text-sm text-slate-600 mb-1"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${item.area}</p>
                    <p class="text-sm text-slate-600 mb-4"><i class="fa-solid fa-phone text-emerald-600 mr-1"></i> ${item.customerMobile}</p>

                    ${!isAccepted ? `
                        <button onclick="acceptOrder('${key}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-sm transition">
                            ऑर्डर स्वीकारा (Accept)
                        </button>
                    ` : `
                        <button disabled class="w-full bg-slate-300 text-slate-600 font-bold py-2 rounded-xl text-sm cursor-not-allowed">
                            स्वीकारलेली ऑर्डर
                        </button>
                    `}
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
