<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharkam - Worker Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD7Y-2un6pfAY8rafRsAzMre-OvNBAkosU",
        authDomain: "gharkam-6c879.firebaseapp.com",
        databaseURL: "https://gharkam-6c879-default-rtdb.firebaseio.com",
        projectId: "gharkam-6c879",
        storageBucket: "gharkam-6c879.firebasestorage.app",
        messagingSenderId: "706729205935",
        appId: "1:706729205935:web:598569d60ad414765e345a"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
    </script>
</head>
<body class="bg-blue-50/50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 border border-slate-100">
        
        <!-- Top Blue Header Card -->
        <div class="bg-blue-100/70 p-5 rounded-2xl flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Gharkam - Worker Panel</h1>
                <p class="text-xs text-slate-500 font-semibold mt-1">Worker: <span class="text-blue-600">--</span></p>
                <p class="text-xs text-slate-500 font-semibold">ID: -- | Service: <span class="text-blue-600">--</span></p>
            </div>
            
            <div class="bg-white p-3 rounded-xl text-center shadow-sm">
                <span class="text-[10px] font-bold text-slate-400 tracking-wider block">WALLET BALANCE</span>
                <span id="walletBalance" class="text-2xl font-black text-emerald-600 block">₹50</span>
                <button onclick="toggleQROption()" class="mt-1 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow-sm transition">
                    + Add Money
                </button>
            </div>
        </div>

        <!-- Hidden QR Code / Topup Panel -->
        <div id="qrSection" class="hidden bg-slate-50 border border-blue-200 rounded-2xl p-4 mb-6 text-center">
            <h3 class="font-bold text-sm text-slate-800 mb-1">QR स्कॅन करून रीचार्ज करा</h3>
            <p class="text-[11px] text-slate-500 mb-3">PhonePe / GPay / Paytm द्वारे ₹100 जमा करा</p>
            <div class="flex flex-col items-center justify-center gap-3">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=upi://pay?pa=7875160724@upi&pn=Gharkam&am=100&cu=INR" alt="UPI QR" class="border bg-white p-2 rounded-xl shadow-sm">
                <a href="upi://pay?pa=7875160724@upi&pn=Gharkam&am=100&cu=INR" class="bg-emerald-600 text-white font-semibold px-4 py-1.5 rounded-lg text-xs shadow-sm">
                    Direct Pay via UPI App
                </a>
                <button onclick="simulateAddMoney(100)" class="text-xs text-blue-600 underline font-semibold mt-1">
                    (टेस्टिंगसाठी: ₹100 वॉलेटमध्ये जमा करा)
                </button>
            </div>
        </div>

        <!-- Select Working Area -->
        <div class="mb-5">
            <label class="block text-sm font-bold text-slate-700 mb-2">Select Working Area:</label>
            <select id="workingArea" class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-medium py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Swargate">Swargate</option>
                <option value="Kothrud">Kothrud</option>
                <option value="Katraj">Katraj</option>
                <option value="Shivajinagar">Shivajinagar</option>
            </select>
        </div>

        <!-- Duty Toggle Button -->
        <div class="mb-6">
            <button id="dutyBtn" onclick="toggleDuty()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-base">
                <span id="dutyDot" class="inline-block w-3 h-3 bg-red-300 rounded-full"></span>
                <span id="dutyText">Duty OFF (Click ON)</span>
            </button>
        </div>

        <hr class="border-slate-100 mb-6">

        <!-- Live Orders Container -->
        <div id="ordersContainer">
            <!-- Duty OFF Sleeping Emoji View -->
            <div id="dutyOffState" class="text-center py-6">
                <div class="text-5xl mb-2">😴</div>
                <p class="text-xs text-slate-400 font-medium">Duty बंद आहे. ऑर्डर्स मिळवण्यासाठी Duty ON करा.</p>
            </div>

            <!-- Active Orders List -->
            <div id="dutyOnState" class="hidden space-y-3">
                <h3 class="font-bold text-slate-700 text-sm mb-2 flex items-center justify-between">
                    <span>उपलब्ध ऑर्डर्स</span>
                    <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold">Live Realtime</span>
                </h3>
                <div id="workerOrdersList" class="space-y-3">
                    <p class="text-slate-400 text-xs text-center py-4">नवीन ऑर्डर्स शोधत आहोत...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isDutyOn = false;
        let currentBalance = 50;

        function toggleQROption() {
            const qrBox = document.getElementById('qrSection');
            qrBox.classList.toggle('hidden');
        }

        function simulateAddMoney(amount) {
            currentBalance += amount;
            document.getElementById('walletBalance').innerText = '₹' + currentBalance;
            alert("वॉलेटमध्ये ₹" + amount + " यशस्वीरीत्या जमा झाले आहेत!");
            document.getElementById('qrSection').classList.add('hidden');
        }

        function toggleDuty() {
            isDutyOn = !isDutyOn;
            const dutyBtn = document.getElementById('dutyBtn');
            const dutyDot = document.getElementById('dutyDot');
            const dutyText = document.getElementById('dutyText');
            const dutyOffState = document.getElementById('dutyOffState');
            const dutyOnState = document.getElementById('dutyOnState');

            if (isDutyOn) {
                dutyBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-base";
                dutyDot.className = "inline-block w-3 h-3 bg-white rounded-full animate-ping";
                dutyText.innerText = "Duty ON (Click OFF)";
                dutyOffState.classList.add('hidden');
                dutyOnState.classList.remove('hidden');
            } else {
                dutyBtn.className = "w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-base";
                dutyDot.className = "inline-block w-3 h-3 bg-red-300 rounded-full";
                dutyText.innerText = "Duty OFF (Click ON)";
                dutyOffState.classList.remove('hidden');
                dutyOnState.classList.add('hidden');
            }
        }

        // Accept Order & Deduct ₹10 Logic
        function acceptOrder(orderKey) {
            if (currentBalance < 50) {
                alert("ऑर्डर स्वीकारण्यासाठी वॉलेटमध्ये किमान ₹50 असणे आवश्यक आहे! कृपया आधी वॉलेट रीचार्ज करा.");
                return;
            }

            database.ref("orders/" + orderKey).update({
                status: "Accepted"
            }).then(() => {
                currentBalance -= 10;
                document.getElementById('walletBalance').innerText = '₹' + currentBalance;
                alert("ऑर्डर स्वीकारली आहे! तुमच्या वॉलेटमधून ₹10 कट करण्यात आले आहेत.");
            }).catch((err) => {
                alert("त्रुटी आली: " + err.message);
            });
        }

        // Realtime Data Listener for Workers
        database.ref("orders").on("value", (snapshot) => {
            const container = document.getElementById('workerOrdersList');
            container.innerHTML = "";
            const data = snapshot.val();

            if(!data) {
                container.innerHTML = '<p class="text-slate-400 text-xs text-center py-4">सध्या कोणतीही ऑर्डर उपलब्ध नाही.</p>';
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const item = data[key];
                const isAccepted = item.status === 'Accepted';

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${isAccepted ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-blue-100 shadow-sm'} transition`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="bg-blue-100 text-blue-800 text-[11px] font-bold px-2 py-0.5 rounded-md">${item.service}</span>
                        <span class="text-[11px] font-semibold ${isAccepted ? 'text-emerald-600' : 'text-amber-600'}">${item.status}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm mb-0.5">${item.customerName}</h4>
                    <p class="text-xs text-slate-500 mb-0.5"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${item.area}</p>
                    <p class="text-xs text-slate-500 mb-3"><i class="fa-solid fa-phone text-emerald-600 mr-1"></i> ${item.customerMobile}</p>

                    ${!isAccepted ? `
                        <button onclick="acceptOrder('${key}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs transition">
                            ऑर्डर स्वीकारा (Accept)
                        </button>
                    ` : `
                        <button disabled class="w-full bg-slate-200 text-slate-500 font-bold py-2 rounded-xl text-xs cursor-not-allowed">
                            स्वीकारलेली ऑर्डर
                        </button>
                    `}
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
